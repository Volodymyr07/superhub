openapi: 3.0.3
info:
  title: Enum Array Example API
  version: 1.0.0
paths:
  /example:
    post:
      summary: Send an array of enums
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nested2:
                  enum:
                    - PENDING
                    - APPROVED
                    - REJECTED
                    - CANCELLED
                  type: string
                  default: PENDING
                  example: PENDING
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
